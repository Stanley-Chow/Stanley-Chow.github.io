      - title: HKU Summer Research Fellowship
        period: "2026"
        meta: Faculty of Science · Supervisor Prof. Zhiwen Zhang
        body: "I study how to reconstruct a hidden heat source, how to judge its recovered shape, and when a reduced model can make the computation faster."
