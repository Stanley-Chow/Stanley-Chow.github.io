    eyebrow: Research in motion · HKU Summer Research Fellowship
    title: Finding a hidden heat source.
    question: "Heat spreads and blurs a source’s shape. Can we work backwards from the temperature to find where it came from?"
    explanation: "Watch three models tackle the same problem. A smaller model can finish quickly, but the examples it learns from affect the shape it recovers."
    watch: Watch the 34-second demo
    image_alt: Three models reconstruct a letter-shaped heat source from temperature measurements
    badge: 34 seconds · No audio
