        body: "我正在探索机器学习训练中的锐度感知优化。课题仍在进行中，暂未发布实验结果。"
      - title: 香港大学暑期研究计划
        period: "2026"
        meta: 理学院 · 指导老师：Zhiwen Zhang 教授
        body: "我研究如何从温度观测中重建隐藏热源，怎样判断恢复的形状是否可靠，以及降阶模型能在什么情况下加快计算。"
        link: 阅读研究详情（英文）
        url: /research/parabolic-inverse-source/
