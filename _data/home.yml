    title: 寻找隐藏的热源。
    question: "热量扩散后，热源的轮廓会变得模糊。只知道最后的温度分布，还能找到热源的位置和形状吗？"
    explanation: "这个演示让三个模型解决同一个问题。小模型算得更快，但训练时见过哪些形状，会影响它最终能还原什么。"
    watch: 观看 34 秒演示（英文说明）
    image_alt: 三个模型从温度观测中重建字母形热源的对比
    badge: 34 秒 · 无音频
